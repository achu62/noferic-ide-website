<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noferic-IDE</title>
<meta name="description" content="A web development IDE which aims to deliver out-of-the-box experience for web development">
<meta name="theme-color" content="#030614">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030614;
    --ink:#edf1fa;
    --muted:#93a0b8;
    --accent:#7ab6ff;
    color-scheme:dark;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  ::selection{background:rgba(110,165,255,.32)}

  /* ---------- the gravitational fabric ---------- */
  #space{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    z-index:0;
    touch-action:none;
  }

  /* ---------- hero content ---------- */
  .hero{
    position:relative;
    z-index:2;
    height:100svh;
    max-width:760px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 5vw 0 clamp(1.5rem,6vw,7rem);
    pointer-events:none; /* let the fabric feel the cursor everywhere */
  }
  .hero h1{
    font-size:clamp(2.9rem,7.2vw,6.2rem);
    font-weight:700;
    letter-spacing:-.025em;
    line-height:1.02;
    text-wrap:balance;
  }
  .hero h1 .accent{
    background:linear-gradient(115deg,#e6f1ff 0%,#8ec2ff 45%,#4f8dff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(90,150,255,.28));
  }
  .tagline{
    margin-top:1.35rem;
    font-size:clamp(1.02rem,1.55vw,1.28rem);
    line-height:1.65;
    color:var(--muted);
    max-width:44ch;
  }
  .actions{
    margin-top:2.6rem;
    display:flex;
    gap:1rem;
    flex-wrap:wrap;
    align-items:center;
  }
  .btn{
    pointer-events:auto;
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    padding:.95rem 2.1rem;
    border-radius:999px;
    font:600 1rem/1 'Space Grotesk',system-ui,sans-serif;
    letter-spacing:.01em;
    text-decoration:none;
    transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s,background .22s;
    will-change:transform;
  }
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn-primary{
    color:#071226;
    background:linear-gradient(135deg,#bcd9ff 0%,#6ea3ff 55%,#4a7dff 100%);
    box-shadow:0 0 26px rgba(90,145,255,.35),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 38px rgba(90,145,255,.5),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn-primary svg{transition:transform .22s}
  .btn-primary:hover svg{transform:translateY(2px)}
  .btn-ghost{
    color:var(--ink);
    border:1px solid rgba(147,160,184,.38);
    background:rgba(255,255,255,.03);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .btn-ghost:hover{
    transform:translateY(-2px);
    border-color:rgba(130,180,255,.55);
    background:rgba(130,180,255,.08);
  }

  /* ---------- interaction hint ---------- */
  #hint{
    position:fixed;
    left:50%;bottom:1.5rem;
    transform:translateX(-50%);
    z-index:2;
    font:500 .72rem/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:rgba(147,160,184,.52);
    user-select:none;
    pointer-events:none;
    transition:opacity 1s ease;
    animation:hintIn 1.6s .9s both;
  }
  #hint.gone{opacity:0}

  /* ---------- supernova transition (Download) ---------- */
  #flash{
    position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 72% 50%,#ffffff 0%,#e8f1ff 16%,#9cc5ff 36%,rgba(80,120,230,.55) 55%,rgba(8,14,40,0) 76%);
  }
  #flash.go{animation:novaFlash 1.5s ease-out forwards}
  @keyframes novaFlash{
    0%{opacity:0}
    26%{opacity:1}
    100%{opacity:0}
  }
  .btn-primary.burst{animation:btnBurst .45s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes btnBurst{
    0%{filter:brightness(1)}
    30%{filter:brightness(2.4);transform:scale(1.09)}
    100%{transform:scale(.55);opacity:0;filter:brightness(3)}
  }

  /* ---------- entrance ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes hintIn{from{opacity:0}to{opacity:1}}
  .hero > *{animation:rise .95s cubic-bezier(.2,.7,.2,1) both}
  .hero > *:nth-child(2){animation-delay:.12s}
  .hero > *:nth-child(3){animation-delay:.24s}

  @media (max-width:720px){
    .hero{justify-content:flex-start;padding-top:12svh}
  }
  @media (prefers-reduced-motion:reduce){
    .hero > *,#hint{animation:none}
    #flash{display:none}
  }
</style>
</head>
<body>

<canvas id="space" aria-hidden="true" label="gravitational fabric animation"></canvas>

<main class="hero">
  <h1>Noferic<span class="accent">-IDE</span></h1>
  <p class="tagline">A web development IDE which aims to deliver out-of-the-box experience for web development</p>
  <div class="actions">
    <a class="btn btn-primary" href="download.html">
      Download
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v14"/><path d="m6 12 6 6 6-6"/></svg>
    </a>
    
  </div>
</main>

<p id="hint">wiggle the fabric with your cursor &middot; click to send a pulse</p>

<div id="flash" aria-hidden="true"></div>

<noscript><style>#hint{display:none}</style></noscript>

<script>
(() => {
'use strict';

const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const PULSE_SPEED = 22;   // world units / second — click waves travel calmly

/* =========================================================
   Camera & world
   A 3D fabric plane viewed in perspective. The camera sits
   CAM_H units above the plane, tilted down by PITCH radians.
   ========================================================= */
const CAM_H = 16;
const PITCH = 0.42;
const cosP = Math.cos(PITCH), sinP = Math.sin(PITCH);
const FOV = 850;

let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, horizonY = 0;

/* The heavy mass: Noferic-IDE */
let BZ = 58, BX = 26, BALL_R = 6.6, WELL_D = 13.5;
const WELL_S = 5.4;
const ball = { x: 0, y: 0, r: 0, groundY: 0 };

/* Fabric grid (world coordinates) */
const ROWS = 84, COLS = 155;
const gzVals = new Float32Array(ROWS);
const xs = new Float32Array(COLS);
for (let i = 0; i < ROWS; i++) gzVals[i] = 6 + 2.8 * i;
for (let j = 0; j < COLS; j++) xs[j] = -184.8 + 2.4 * j;
const NP = ROWS * COLS;
const px = new Float32Array(NP), py = new Float32Array(NP);
const vis = new Uint8Array(NP);
const CULL = 90;   // px margin outside the viewport that is still worth drawing

/* Stars */
let stars = [];

/* Interaction state */
const mouse = { on: false, amp: 0, wx: 0, wz: 0, sx: 0, sy: 0, energy: 0, pwx: 0, pwz: 0 };
const pulses = [];
let haloBoost = 0, ballWob = 0;
let novaT0 = -1, novaPulsed = false;   // supernova sequence (Download click)
let t = 0, last = 0;

/* ---------------------------------------------------------
   Screen point -> ray -> intersection with the fabric plane
   --------------------------------------------------------- */
function unproject(sx, sy) {
  const dxc = (sx - CX) / FOV;
  const dyc = (CY - sy) / FOV;
  const dirY = dyc * cosP - sinP;        // world-space y of the ray
  if (dirY > -0.03) return null;         // ray points above the horizon
  const tt = -CAM_H / dirY;
  const dirZ = dyc * sinP + cosP;
  return { x: tt * dxc, z: tt * dirZ };
}

/* ---------------------------------------------------------
   Fabric displacement field:
   a static gravity well under the mass + continuous waves
   radiating from it + ripples around the cursor + pulses
   --------------------------------------------------------- */
function disp(x, z) {
  const dx = x - BX, dz = z - BZ;
  const d = Math.sqrt(dx * dx + dz * dz);
  let y = -WELL_D * WELL_S / Math.sqrt(d * d + WELL_S * WELL_S);
  if (!reduced) {
    y += 0.95 * Math.sin(d * 0.45 - t * 1.6) * Math.exp(-d * 0.011);
    if (mouse.amp > 0.004) {
      const mx = x - mouse.wx, mz = z - mouse.wz;
      const md = Math.sqrt(mx * mx + mz * mz);
      const amp = mouse.amp * (1 + Math.min(0.7, mouse.energy * 0.02));   // moving fast stirs a little harder
      y -= amp * 1.05 * Math.exp(-md * md * 0.005);                       // the cursor gently presses the fabric down
      y += amp * 0.75 * Math.sin(md * 0.8 - t * 2.4) * Math.exp(-md * 0.05);   // slow, soft wiggle rings around the cursor
      y += amp * 0.22 * Math.sin(md * 1.5 + t * 2.0) * Math.exp(-md * 0.07);   // faint shimmer on top
    }
    for (let p = 0; p < pulses.length; p++) {
      const P = pulses[p], age = t - P.t0;
      const gx = x - P.x, gz = z - P.z;
      const g = Math.sqrt(gx * gx + gz * gz) - age * PULSE_SPEED;
      y += P.amp * Math.exp(-g * g * 0.018) * Math.exp(-age * 0.55);
    }
  }
  return y;
}

/* ---------------------------------------------------------
   Layout: canvas sizing + placing the mass on screen
   --------------------------------------------------------- */
function layout() {
  DPR = Math.min(devicePixelRatio || 1, 1.75);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CX = W * 0.5;
  CY = H * 0.58;
  horizonY = CY - FOV * Math.tan(PITCH);

  const portrait = H > W * 1.05;
  const fx = portrait ? 0.68 : (W < 1280 ? 0.78 : 0.72);
  BZ = portrait ? 46 : 58;
  BALL_R = (portrait ? 5.4 : 6.6) * Math.min(1.55, Math.max(0.92, W / 1500));
  WELL_D = portrait ? 11.5 : 13.5;

  const lift = BALL_R * 0.55;
  const yC = -WELL_D + lift - CAM_H;               // ball centre (camera-relative y)
  const zcB = -yC * sinP + BZ * cosP;
  BX = (fx - 0.5) * W * zcB / FOV;
  ball.x = CX + (fx - 0.5) * W;
  ball.r = FOV * BALL_R / zcB;
  ball.y = CY - FOV * (yC * cosP + BZ * sinP) / zcB;

  const yG = -WELL_D - CAM_H;                      // bottom of the gravity well
  const zcG = -yG * sinP + BZ * cosP;
  ball.groundY = CY - FOV * (yG * cosP + BZ * sinP) / zcG;

  makeStars();
  makeGridGrad();
  makeBackdrops();
}

/* Static backdrop, vignette and horizon haze are expensive gradient fills,
   so they are rendered once per resize into cached bitmaps. */
let bgCanvas = null, vigCanvas = null, hzCanvas = null;
function makeBackdrops() {
  const w = Math.max(1, Math.round(W * DPR)), h = Math.max(1, Math.round(H * DPR));

  bgCanvas = document.createElement('canvas');
  bgCanvas.width = w; bgCanvas.height = h;
  const b = bgCanvas.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  let g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#030614');
  g.addColorStop(0.6, '#050a1a');
  g.addColorStop(1, '#0a1428');
  b.fillStyle = g;
  b.fillRect(0, 0, W, H);

  vigCanvas = document.createElement('canvas');
  vigCanvas.width = w; vigCanvas.height = h;
  const v = vigCanvas.getContext('2d');
  v.setTransform(DPR, 0, 0, DPR, 0, 0);
  g = v.createRadialGradient(CX, H * 0.46, Math.min(W, H) * 0.42, CX, H * 0.5, Math.hypot(W, H) * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,5,0.42)');
  v.fillStyle = g;
  v.fillRect(0, 0, W, H);

  hzCanvas = document.createElement('canvas');
  hzCanvas.width = w; hzCanvas.height = Math.max(1, Math.ceil(176 * DPR));
  const hz = hzCanvas.getContext('2d');
  hz.setTransform(DPR, 0, 0, DPR, 0, 0);
  g = hz.createLinearGradient(0, 0, 0, 176);
  g.addColorStop(0, 'rgba(140,170,220,0)');
  g.addColorStop(0.35, 'rgba(140,170,220,0.055)');
  g.addColorStop(1, 'rgba(140,170,220,0)');
  hz.fillStyle = g;
  hz.fillRect(0, 0, W, 176);
}

function makeStars() {
  stars.length = 0;
  const skyH = Math.max(60, horizonY - 6);
  const n = Math.round(W * skyH / 7000);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * skyH,
      r: Math.random() * 1.2 + 0.4,
      p: Math.random() * TAU,
      s: 0.3 + Math.random() * 1.1,
      a: 0.2 + Math.random() * 0.55
    });
  }
}

let gridGrad = null;
function makeGridGrad() {
  gridGrad = ctx.createLinearGradient(0, H, 0, Math.max(40, horizonY));
  gridGrad.addColorStop(0, 'rgba(150,185,235,0.40)');
  gridGrad.addColorStop(0.45, 'rgba(150,185,235,0.15)');
  gridGrad.addColorStop(1, 'rgba(150,185,235,0)');
}

/* ---------------------------------------------------------
   A circle of radius R drawn on the fabric, hugging its curves
   --------------------------------------------------------- */
function drawFabricCircle(wx, wz, R, a) {
  ctx.strokeStyle = 'rgba(130,180,255,' + a.toFixed(3) + ')';
  ctx.beginPath();
  let pen = false;
  for (let si = 0; si <= 56; si++) {
    const an = si / 56 * TAU;
    const cxw = wx + Math.cos(an) * R;
    const czw = wz + Math.sin(an) * R;
    const y = disp(cxw, czw) - CAM_H;
    const zc = -y * sinP + czw * cosP;
    if (zc < 2) { pen = false; continue; }            // behind the camera
    const sxp = CX + FOV * cxw / zc;
    const syp = CY - FOV * (y * cosP + czw * sinP) / zc;
    pen ? ctx.lineTo(sxp, syp) : ctx.moveTo(sxp, syp);
    pen = true;
  }
  ctx.stroke();
}

/* ---------------------------------------------------------
   Rendering
   --------------------------------------------------------- */
function render() {
  /* deep space background (cached bitmap) */
  ctx.drawImage(bgCanvas, 0, 0, W, H);

  /* stars, with a whisper of parallax */
  const par = mouse.on ? (mouse.sx - CX) * 0.008 : 0;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = s.a * (0.6 + 0.4 * Math.sin(s.p + t * s.s));
    ctx.fillStyle = 'rgba(200,220,255,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x + par, s.y, s.r, s.r);
  }

  /* haze along the horizon (cached bitmap) */
  ctx.drawImage(hzCanvas, 0, horizonY - 46, W, 176);

  /* ---- the fabric: deform, project, cull, draw ---- */
  let k = 0;
  for (let i = 0; i < ROWS; i++) {
    const z = gzVals[i];
    for (let j = 0; j < COLS; j++, k++) {
      const x = xs[j];
      const y = disp(x, z) - CAM_H;
      const zc = -y * sinP + z * cosP;
      const sxp = CX + FOV * x / zc;
      const syp = CY - FOV * (y * cosP + z * sinP) / zc;
      px[k] = sxp; py[k] = syp;
      vis[k] = (sxp > -CULL && sxp < W + CULL && syp > -CULL && syp < H + CULL) ? 1 : 0;
    }
  }
  ctx.lineWidth = 1;
  ctx.strokeStyle = gridGrad;

  ctx.beginPath();                                   // rows (constant depth)
  for (let i = 0; i < ROWS; i++) {
    let pen = false;
    for (let j = 0; j < COLS; j++) {
      const p = i * COLS + j;
      if (!vis[p]) { pen = false; continue; }        // skip segments fully outside the view
      pen ? ctx.lineTo(px[p], py[p]) : ctx.moveTo(px[p], py[p]);
      pen = true;
    }
  }
  ctx.stroke();

  ctx.beginPath();                                   // columns (constant x)
  for (let j = 0; j < COLS; j++) {
    let pen = false;
    for (let i = 0; i < ROWS; i++) {
      const p = i * COLS + j;
      if (!vis[p]) { pen = false; continue; }
      pen ? ctx.lineTo(px[p], py[p]) : ctx.moveTo(px[p], py[p]);
      pen = true;
    }
  }
  ctx.stroke();

  /* ---- light the fabric casts back around the mass ---- */
  ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createRadialGradient(ball.x, ball.groundY, ball.r * 0.2, ball.x, ball.groundY, ball.r * 6.5);
  g.addColorStop(0, 'rgba(110,160,255,0.15)');
  g.addColorStop(0.5, 'rgba(100,150,255,0.05)');
  g.addColorStop(1, 'rgba(90,140,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(ball.x, ball.groundY, ball.r * 6.5, 0, TAU);
  ctx.fill();

  /* ---- expanding gravitational wavefronts ---- */
  if (!reduced) {
    ctx.lineWidth = 1.4;
    for (let q = 0; q < 3; q++) {
      const ph = (t * 0.07 + q / 3) % 1;
      const R = 8 + ph * 126;
      const a = Math.pow(1 - ph, 2.2) * 0.26;
      drawFabricCircle(BX, BZ, R, a);
    }
    /* bright rims riding on click pulses */
    ctx.lineWidth = 2;
    for (let p = 0; p < pulses.length; p++) {
      const P = pulses[p], age = t - P.t0;
      const a = Math.max(0, 1 - age / 4.2) * 0.55;
      if (a <= 0.01) continue;
      drawFabricCircle(P.x, P.z, age * PULSE_SPEED, a);
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  drawBall();

  /* vignette (cached bitmap) */
  ctx.drawImage(vigCanvas, 0, 0, W, H);
}

function drawBall() {
  if (novaT0 >= 0) { drawNova(); return; }
  const r = ball.r * (1 + 0.012 * Math.sin(t * 1.1)) * (1 + haloBoost * 0.06);
  /* a heavy body barely drifts — but poke it and it wobbles */
  const wob = (0.5 + ballWob * ballWob * 3.2) * ball.r * 0.018;
  const bx = ball.x + Math.sin(t * 1.5) * wob;
  const by = ball.y + Math.cos(t * 1.3) * wob * 0.7;

  /* corona */
  const hr = r * (3.1 + haloBoost * 0.9);
  const ha = 0.5 + haloBoost * 0.35;
  let g = ctx.createRadialGradient(bx, by, r * 0.4, bx, by, hr);
  g.addColorStop(0, 'rgba(150,195,255,' + (0.42 * ha).toFixed(3) + ')');
  g.addColorStop(0.4, 'rgba(110,160,255,' + (0.13 * ha).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(90,140,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(bx, by, hr, 0, TAU);
  ctx.fill();

  /* body */
  g = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.36, r * 0.08, bx, by, r);
  g.addColorStop(0, '#f4f9ff');
  g.addColorStop(0.26, '#cfe4ff');
  g.addColorStop(0.58, '#7fb2ff');
  g.addColorStop(0.88, '#3a63d8');
  g.addColorStop(1, '#131f4d');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, TAU);
  ctx.fill();

  /* slow-drifting surface mottling */
  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, r, 0, TAU);
  ctx.clip();
  for (let m = 0; m < 3; m++) {
    const mxp = bx + Math.sin(t * 0.05 + m * 2.4) * r * 0.55;
    const myp = by + Math.cos(t * 0.04 + m * 1.7) * r * 0.4;
    const mr = r * (0.3 + 0.12 * m);
    const mg = ctx.createRadialGradient(mxp, myp, 0, mxp, myp, mr);
    mg.addColorStop(0, 'rgba(20,45,120,0.20)');
    mg.addColorStop(1, 'rgba(20,45,120,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(mxp, myp, mr, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  /* rim light */
  ctx.strokeStyle = 'rgba(190,220,255,0.6)';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.arc(bx, by, r - 0.4, 0, TAU);
  ctx.stroke();
}

/* --- supernova: collapse, then detonate --- */
function drawNova() {
  const nph = Math.min(1.2, (t - novaT0) / 1.5);
  if (nph < 0.2) {
    /* collapse — the star implodes, shivering */
    const c = nph / 0.2;
    const r = ball.r * (1 - 0.42 * c);
    const bx = ball.x + (Math.random() - 0.5) * r * 0.24 * c;
    const by = ball.y + (Math.random() - 0.5) * r * 0.24 * c;
    const hr = r * (3.1 + c * 1.8);
    let g = ctx.createRadialGradient(bx, by, r * 0.4, bx, by, hr);
    g.addColorStop(0, 'rgba(205,228,255,' + Math.min(1, 0.55 + c * 0.45).toFixed(3) + ')');
    g.addColorStop(0.4, 'rgba(130,175,255,' + (0.2 + c * 0.25).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(90,140,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, hr, 0, TAU); ctx.fill();
    g = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.36, r * 0.08, bx, by, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.5, '#dceaff');
    g.addColorStop(1, '#3a63d8');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
  } else {
    /* detonation — a fireball blooms and fades */
    const e = Math.min(1, (nph - 0.2) / 0.8);
    const fade = Math.pow(1 - e, 1.6);
    if (fade > 0.012) {
      ctx.globalCompositeOperation = 'lighter';
      const fr = ball.r * (0.5 + e * 9.5);
      const fg = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, fr);
      fg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * fade).toFixed(3) + ')');
      fg.addColorStop(0.35, 'rgba(185,215,255,' + (0.5 * fade).toFixed(3) + ')');
      fg.addColorStop(1, 'rgba(90,140,255,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, fr, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(215,235,255,' + (0.75 * fade).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, fr * 0.6, 0, TAU); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
  }
}

/* ---------------------------------------------------------
   Animation loop
   --------------------------------------------------------- */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;
  t += dt;
  mouse.amp += ((mouse.on ? 1 : 0) - mouse.amp) * Math.min(1, dt * 3);
  const spd = mouse.on ? Math.hypot(mouse.wx - mouse.pwx, mouse.wz - mouse.pwz) / Math.max(dt, 0.001) : 0;
  mouse.energy += (Math.min(spd, 60) - mouse.energy) * Math.min(1, dt * 5);
  mouse.pwx = mouse.wx; mouse.pwz = mouse.wz;
  haloBoost *= Math.exp(-dt * 2.8);
  if (novaT0 >= 0 && !novaPulsed && t - novaT0 > 0.32) {   // the star answers the burst
    novaPulsed = true;
    haloBoost = 1.5;
    pulses.push({ x: BX, z: BZ, t0: t, amp: 4.6 });
  }
  const overBall = mouse.on && Math.hypot(mouse.sx - ball.x, mouse.sy - ball.y) < ball.r * 1.35;
  ballWob += ((overBall ? 1 : 0) - ballWob) * Math.min(1, dt * 4);
  for (let p = pulses.length - 1; p >= 0; p--) {
    if (t - pulses[p].t0 > 7.5) pulses.splice(p, 1);
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------
   Input
   --------------------------------------------------------- */
addEventListener('pointermove', e => {
  mouse.sx = e.clientX; mouse.sy = e.clientY;
  const u = unproject(e.clientX, e.clientY);
  if (u) { mouse.wx = u.x; mouse.wz = u.z; mouse.on = true; }
  else mouse.on = false;
  dismissHint();
}, { passive: true });

addEventListener('pointerdown', e => {
  if (reduced) return;
  const d = Math.hypot(e.clientX - ball.x, e.clientY - ball.y);
  if (d < ball.r * 1.25) {
    haloBoost = 1.2;
    pulses.push({ x: BX, z: BZ, t0: t, amp: 2.6 });
  } else {
    const u = unproject(e.clientX, e.clientY);
    if (u) pulses.push({ x: u.x, z: u.z, t0: t, amp: 2.0 });
  }
  if (pulses.length > 8) pulses.shift();
  dismissHint();
});

document.documentElement.addEventListener('mouseleave', () => { mouse.on = false; });
addEventListener('blur', () => { mouse.on = false; });

/* ---------------------------------------------------------
   Download → supernova → download.html
   --------------------------------------------------------- */
const dlBtn = document.querySelector('.btn-primary[href="download.html"]');
if (dlBtn) {
  dlBtn.addEventListener('click', e => {
    if (reduced) return;                       // straight there, no theatrics
    e.preventDefault();
    if (novaT0 >= 0) return;                   // already mid-supernova
    novaT0 = t;
    try { burstButton(dlBtn); } catch (_) {}
    const f = document.getElementById('flash');
    if (f) { f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
    setTimeout(() => { location.href = dlBtn.href; }, 1500);   // navigation is guaranteed
  });
}

function burstButton(btn) {
  btn.classList.add('burst');
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cols = ['#ffffff', '#cfe4ff', '#8ec2ff', '#4f8dff'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span');
    const sz = 2 + Math.random() * 5;
    s.style.cssText = 'position:fixed;left:' + (cx - sz / 2).toFixed(1) + 'px;top:' + (cy - sz / 2).toFixed(1) +
      'px;width:' + sz.toFixed(1) + 'px;height:' + sz.toFixed(1) + 'px;border-radius:50%;background:' +
      cols[i & 3] + ';pointer-events:none;z-index:7;box-shadow:0 0 6px rgba(150,190,255,.85)';
    document.body.appendChild(s);
    const ang = Math.random() * TAU;
    const dist = 50 + Math.random() * 300;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist * 0.75;
    s.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + (0.15 + Math.random() * 0.4).toFixed(2) + ')', opacity: 0 }
    ], { duration: 650 + Math.random() * 750, easing: 'cubic-bezier(.12,.66,.3,1)' }).onfinish = () => s.remove();
  }
}

function dismissHint() {
  if (hint && !hint.classList.contains('gone')) hint.classList.add('gone');
}

/* ---------------------------------------------------------
   Boot
   --------------------------------------------------------- */
addEventListener('resize', () => {
  layout();
  if (reduced) render();
});

layout();
if (reduced) {
  render();                                          // a still fabric, no motion
} else {
  last = performance.now();
  requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
